name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Derle ve test et
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testleri çalıştır
        run: npm test

      - name: Üretim derlemesi
        run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/

      - name: Pages ayarları
        uses: actions/configure-pages@v5

      - name: Derlemeyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Yayınla
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
